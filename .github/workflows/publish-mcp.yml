name: Publish to MCP Registry

# Bump "version" in server.json, then push a tag vX.Y.Z (or run manually).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC login for the io.github.CalmNguyen/* namespace
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches server.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version server.json)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != server.json version $version"; exit 1; }

      - name: Install mcp-publisher
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
